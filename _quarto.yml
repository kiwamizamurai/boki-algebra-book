project:
  type: book
  output-dir: _book

book:
  title: "Learning University Mathematics through the Algebra of Bookkeeping"
  author: "kiwamizamurai"
  description: "A textbook that teaches university mathematics through double-entry bookkeeping, with the main theorems formalized in Lean 4."
  cover-image: images/cover.svg
  cover-image-alt: "Cover: the book title above a T-account with debit amounts a and c and credit amounts b and d, and the relation (a, b) ~ (c, d) if and only if a + d = b + c."
  site-url: https://kiwamizamurai.github.io/boki-algebra-book
  repo-url: https://github.com/kiwamizamurai/boki-algebra-book
  repo-branch: main
  repo-actions: [edit, issue, source]
  downloads: [pdf]
  search: true
  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true
  output-file: boki-algebra-book
  chapters:
    - index.qmd
    - part: chapters/p00-research/index.qmd
      chapters:
        - chapters/p00-research/01-question.qmd
        - chapters/p00-research/02-keywords.qmd
        - chapters/p00-research/03-first-paper.qmd
        - chapters/p00-research/04-citations.qmd
        - chapters/p00-research/05-japanese.qmd
        - chapters/p00-research/06-older-literature.qmd
        - chapters/p00-research/07-reading.qmd
        - chapters/p00-research/08-organizing.qmd
        - chapters/p00-research/09-limits.qmd
        - chapters/p00-research/10-writing-up.qmd
    - part: chapters/p01-logic/index.qmd
      chapters:
        - chapters/p01-logic/01-propositions.qmd
        - chapters/p01-logic/02-proofs.qmd
        - chapters/p01-logic/03-sets.qmd
        - chapters/p01-logic/04-maps.qmd
        - chapters/p01-logic/05-relations.qmd
        - chapters/p01-logic/06-orders.qmd
        - chapters/p01-logic/07-induction.qmd
        - chapters/p01-logic/08-numbers.qmd
    - part: chapters/p02-bookkeeping/index.qmd
