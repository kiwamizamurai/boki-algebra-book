bibliography: references.bib
lang: en

number-sections: true
number-depth: 2
toc: true
toc-depth: 3

crossref:
  chapters: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    html-math-method: mathjax
    code-copy: true
    code-link: false
    syntax-definitions:
      - syntax/lean4.xml
    citations-hover: true
    crossrefs-hover: true
    link-external-newwindow: true
  pdf:
    documentclass: scrbook
    classoption: [twoside]
    papersize: a4
    pdf-engine: lualatex
    CJKmainfont: HaranoAjiMincho-Regular
    CJKoptions:
      - BoldFont=HaranoAjiMincho-Bold
    syntax-definitions:
      - syntax/lean4.xml
    colorlinks: true
    toc: true
    lof: false
    lot: false
